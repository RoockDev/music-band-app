server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: banda-app-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banda}
    username: ${DB_USERNAME:banda}
    password: ${DB_PASSWORD:banda}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    validate-on-migrate: true
    # Existing databases may opt in once, only after their schema has been verified to
    # match V1 exactly. New/empty databases and normal startups must keep this false.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  mail:
    # REQUIRED, no default -- see app.jwt.secret's comment below for the established
    # fail-fast pattern this mirrors. Unlike app.mail.from (a non-secret, cosmetic sender
    # address), host/port silently carrying a local-dev value (localhost:1025, Mailpit's
    # port) into a prod deployment that forgot to override them would NOT fail startup:
    # POST /api/contact would keep returning 201 forever while every admin notification
    # silently failed against an unreachable host, with zero operator-visible signal. Local
    # dev/tests supply this explicitly (see README, application-test.yml), same as JWT_SECRET.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # ContactService#notifyAdmins calls EmailSender#send synchronously, per admin, on
          # the Tomcat request thread -- POST /api/contact is unauthenticated and has no
          # rate limiting. Without an explicit bound here, a stalled/unresponsive SMTP host
          # can hang a request thread indefinitely; a handful of concurrent submissions
          # against a hung SMTP target could exhaust the whole worker pool (a full outage,
          # not just a degraded contact form). 5s per phase bounds the worst case to
          # N admins x ~15s per request instead of an indefinite hang.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      # Section 5 upload is whole-file-in-memory by design (FileStorage's own Javadoc:
      # "acceptable at this app's scale", no true streaming) -- an unbounded upload would let
      # a single request exhaust heap. 20MB comfortably covers a real scanned sheet-music PDF
      # (a multi-page scan at a reasonable DPI is typically a few MB; 20MB leaves headroom for
      # a dense/high-resolution scan without being large enough to be a practical DoS vector
      # for this app's scale). max-request-size matches since a request carries exactly one
      # file part today.
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    # REQUIRED, no default. This is a live HMAC signing key — a hardcoded fallback here
    # would be a real, functional secret committed to git that anyone with repo access
    # could use to forge an ADMIN JWT if the env var were ever unset. Spring fails fast
    # at startup instead (see README for how to set it locally).
    secret: ${JWT_SECRET}
    # Design decision #9: single moderate-lifetime access token, no refresh token. 8h default,
    # exact value within the 8-12h band left configurable (open product preference).
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT8H}
  auth:
    activation-token-ttl: ${ACTIVATION_TOKEN_TTL:P1D}
    reset-token-ttl: ${RESET_TOKEN_TTL:PT1H}
  security:
    # httpOnly+Secure+SameSite cookie flag (design decision #9). Override to false only
    # for plain-HTTP local dev without TLS (see README) — never in a real deployment.
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:true}
  file-storage:
    # Design decision #3: local disk on a persistent volume (decision #4), deliberately
    # outside src/main/resources/static or any other classpath location Spring Boot
    # auto-serves — never static-served, per Section 5's explicit requirement.
    base-dir: ${APP_FILE_STORAGE_BASE_DIR:/data/files}
  mail:
    # REQUIRED, no default -- unlike spring.mail.host/port above, this value isn't a secret,
    # but the SAME silent-blackhole risk applies: a prod deployment that forgets to set it
    # would boot fine, and every outbound admin notification would silently carry a
    # local-dev sender address instead of failing loudly. Fail fast instead, same pattern as
    # JWT_SECRET and spring.mail.host/port. Local dev/tests supply this explicitly (see
    # README, application-test.yml).
    from: ${MAIL_FROM}
