spring:
  main:
    # Lets test-only @TestConfiguration classes override a bean (e.g. a fixed Clock)
    # for deterministic time-based assertions (token TTL/expiry scenarios).
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      # Each distinct @Import(...FixedClockConfig) test class builds its own
      # MergedContextConfiguration and therefore its own cached ApplicationContext + HikariCP
      # pool, all pointed at the SAME single Testcontainers Postgres instance (the
      # "singleton container" pattern IntegrationTestBase documents). With HikariCP's
      # default pool size (10) and enough distinct integration test contexts alive at once
      # (Spring's test context cache keeps up to 32), total connections can approach/exceed
      # Postgres's default max_connections and intermittently fail unrelated test classes
      # with "Unable to determine Dialect without JDBC metadata" at context-boot time. Each
      # test context only ever runs one MockMvc request at a time (no real concurrency), so a
      # small pool is more than enough and keeps total connection usage bounded as the suite
      # grows.
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: create-drop

  # Existing integration tests deliberately let Hibernate create/drop their schema.
  # Flyway is enabled explicitly only by FlywaySchemaIntegrationTest.
  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: test-only-secret-not-for-production-test-only-secret
    access-token-ttl: PT8H
  auth:
    activation-token-ttl: P1D
    reset-token-ttl: PT1H
    password-reset-min-response-time: PT0S
  frontend:
    base-url: http://localhost:4200
  security:
    # Integration tests run over plain HTTP via MockMvc/TestRestTemplate (no TLS), so a
    # Secure-flagged cookie would never round-trip back to the client — disable it here.
    cookie-secure: false
    public-write-rate-limit:
      login:
        requests: 1000
        window: PT1M
      password-reset:
        requests: 1000
        window: PT15M
      token-redemption:
        requests: 1000
        window: PT15M
      contact:
        requests: 1000
        window: PT10M
  file-storage:
    # Fallback only: every @SpringBootTest integration test extends IntegrationTestBase,
    # which always overrides this via @DynamicPropertySource with a fresh, cleaned-up
    # @TempDir-equivalent directory per JVM test run (see that class's own Javadoc). This
    # value only applies if some future test loads the "test" profile without going through
    # that base class.
    base-dir: ${java.io.tmpdir}/banda-test-files
  mail:
    # Supplied directly here, same as app.jwt.secret above -- production config no longer
    # has a default (see application.yml), so tests must supply this explicitly.
    from: test-no-reply@banda.local
